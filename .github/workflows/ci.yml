name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "Isaac Repentance+ iOS v1.0.9"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.9)

            ### What's Fixed in v1.0.9:
            - **Fixed Crash on Run Entry (Codesigning Protection Fault)**: Removed in-memory instruction patching of executable `__TEXT` code pages (`PatchNaturalVoidPortals`), which caused a `KERN_PROTECTION_FAILURE` / `CODESIGNING: Invalid Page` crash on iOS (especially inside LiveContainer).
            - **Non-Invasive Rogue Portal Purge**: Rogue/natural duplicate Void portals are now safely detected and cleaned up via heap grid entity management (`SafeReadBytes` batch scanning + C++ deleting destructor), completely eliminating crashes while keeping 100% clean single-portal generation.
            - **Performance Optimization**: Scanning of rooms now exits immediately on all regular floors (Basement through Womb non-boss rooms) with zero overhead, and grid entity reads use batch memory copies.
            - **Retained All Features**:
              - Complete disabling of Void portals during Challenge runs and Daily runs;
              - Mega Satan & Mother Phase 1 fix (only triggers after Phase 2 is dead);
              - Cinematic chest landing delay (~1.2s after chest drops);
              - Seraphim + Conjoined in EID with live counter synchronization;
              - Revelation (0 soul hearts), Mega Bean (6 charges), 2Spooky (Quality 2).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
