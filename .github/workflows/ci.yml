name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11
          name: "Isaac Repentance+ iOS v1.0.11"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.11)

            ### What's Fixed in v1.0.11:
            - **Cleaned Up ItemConfig Overwrites**: Removed extraneous and invalid item ID modifications (e.g. Breath of Life timed hold mechanic, Kidney Stone, Broken Glass Cannon, Head of the Keeper).
            - **Authentic Rep+ Balance Focus**:
              - **Revelation (ID 643)**: 0 soul hearts upon pickup (authentic Rep+ nerf).
              - **Mega Bean (ID 351)**: 6 charges (authentic Rep+ rework).
              - **2Spooky (ID 554)**: Quality 2 (authentic Rep+ buff).
              - **Transformations (Seraphim & Conjoined)**: Soul Locket, Act of Contrition, Twisted Pair, Incubus dynamically credited to player counters and synced in EID.
            - **All Void Portal Features Retained**: Mega Satan chest delay (~1.2s), Phase 1/Phase 2 strict validation, continuous natural portal suppression, guaranteed Void portals after Mega Satan, Mother, The Lamb, and ???.

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
