name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.13
          name: "Isaac Repentance+ iOS v1.0.13 (Void Portal & Mega Satan Fix)"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.13)

            ### What's Fixed in v1.0.13:
            - **Fixed Mega Satan Room Detection & Cutscene Suppression**: Replaced invalid `roomType == 22` check with direct entity tracking (`Type 274` Phase 1, `Type 275` Phase 2). Defeating Phase 2 now reliably suppresses the Ending 16 cutscene, spawns the victory Big Chest (5.340), and creates the guaranteed Void Portal.
            - **Fixed Blue Baby & The Lamb Victory Verification**: Victory is now triggered by Big Chest (`Type 5, Variant 340`) appearance, completely eliminating false lockouts caused by remaining flies or minions (`Type >= 10`).
            - **Safe Natural Portal Retention**: Rather than prematurely deleting the natural 50% Void Portal and risking spawn desyncs, existing portals are preserved and only excess duplicates are removed.
            - **LiveContainer Race Condition Fix**: Startup now features a polling retry timer that waits for the Isaac executable to map into dyld, preventing premature initialization failure.
            - **Added Documents File Logging**: Diagnostic logs are now written directly to `Documents/isaacrepplus_log.txt` on iOS for easy inspection in the Files app.

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
