name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          name: "Isaac Repentance+ iOS v1.0.14 (Mega Satan Cutscene Crash Fix)"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.14)

            ### What's Fixed in v1.0.14:
            - **Fixed Mega Satan Crash Upon Defeat**: In v1.0.13, attempting to suppress the Ending 16 cutscene via `CutsceneEvent + 0x10` caused `SIGSEGV` / `EXC_BAD_ACCESS` when the engine update loop tried to dereference the sentinel pointer (`ldr w8, [x8, #8]`).
            - **Clean Engine-Level Cutscene Suppression**:
              - Defeating Mega Satan Phase 2 sets `[entity + 0xbd4] = -1`. The game's native Mega Satan death routine (`0x10078c954`) evaluates `tbnz w8, #0x1f, #0x10078c9b8` and skips the Ending 16 cutscene trigger cleanly without memory corruption.
              - Added code-level `RET` protection on `0x1006ddcdc` (Mega Satan cutscene trigger function).
              - Mega Satan now drops the Big Chest (5.340) and spawns the guaranteed Void Portal below the chest with zero crashes.
            - **All Boss Void Portals Verified**: Void Portals now spawn reliably after Mega Satan, Mother (Corpse II), The Lamb (Dark Room), and ??? / Blue Baby (Chest).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
