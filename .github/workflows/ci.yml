name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.16
          name: "Isaac Repentance+ iOS v1.0.16 (Restored Rep+ Item Balance & Seraphim Transformation)"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.16)

            ### What's Fixed in v1.0.16:
            - **Restored Authentic Rep+ Item Balance**:
              - **Revelation (ID 643)**: Gives 0 soul hearts upon pickup (authentic Rep+ nerf).
              - **Mega Bean (ID 351)**: Reworked to 6 max charges.
              - **2Spooky (ID 554)**: Upgraded to Quality 2.
            - **Restored Seraphim Transformation Progression (ID 390)**:
              - Familiar Seraphim (390) dynamically increments the Seraphim transformation counter in memory (3/3 grants holy flight).
              - Fully synchronized with EID live transformation tracking.
            - **100% Retained Guaranteed Void Portals & Mega Satan Cutscene Suppression**.

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
