name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Isaac Repentance+ iOS v1.0.2"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.2)

            ### What's Fixed in v1.0.2:
            - **LiveContainer Base Address Fix**: Fixed critical address calculation where `slide + RVA` was off by 4GB inside LiveContainer's dynamic library loader. Now resolves `header + RVA` identically in both LiveContainer and native jailbreak environments.
            - **Guaranteed Void Portals (100% chance)**:
              - **The Lamb** (Dark Room): Void portal spawns adjacent to the Big Chest upon defeat.
              - **??? / Blue Baby** (Chest): Void portal spawns adjacent to the Big Chest upon defeat.
              - **Mother** (Corpse II): Void portal spawns in the boss arena upon defeat.
              - **Mega Satan** (Chest / Dark Room): Suppresses the abrupt vanilla Ending 16 cutscene kick, spawns the guaranteed Void portal, and spawns the Big Chest so the player can choose either to enter The Void or finish the run via chest!
            - **Repentance+ Item Balance Adjustments**:
              - **Revelation** (643): `soulhearts` set to 0 (no longer grants +2 soul hearts upon pickup).
              - **Mega Bean** (351): Max charges set to 6 (Rep+ balance rework).
              - **2Spooky** (554): Upgraded to Quality 2.
              - **Seraphim Familiar** (390): Correctly credits +1 towards Seraphim transformation (grants flight at 3/3).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
