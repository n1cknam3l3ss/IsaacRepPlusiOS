name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.18
          name: "Isaac Repentance+ iOS v1.0.18 (Accurate Mega Satan Room Detection & 5-Point Cutscene Interception)"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.18)

            ### What's Fixed in v1.0.18:
            - **Accurate Mega Satan Room Detection**:
              - Corrected native `roomType` offset to `roomAddr + 0x10 == 5` (matching engine `0x1005a9154`) and `roomVariant` to `roomData + 0x10 == 89`.
              - Removed restrictive stage checks so Mega Satan's room is recognized reliably regardless of stage state.
            - **Comprehensive 5-Point Cutscene Suppression**:
              - Point 1: Constantly zeroes the 89-frame countdown timer in `g_Game + 0x2A5930`.
              - Point 2: Aborts `CutsceneSequence` object in `g_Game + 0x25C00`.
              - Point 3: Intercepts Manager immediate cutscene trigger `0x1F6D20` written by `Game::Update`.
              - Point 4: Intercepts Manager queued cutscenes `0x1F6D08` / `0x1F6D0C` and `0x1F6CEC` / `0x1F6CF0`.
              - Point 5: Restores Manager game state `0x204C0` back to 1 (Gameplay) if flipped to 3/5.
            - **High-Frequency 30ms Watchdog**:
              - Watchdog timer upgraded to 30ms (~33Hz) and added to `NSRunLoopCommonModes` for zero-frame drop interception.
            - **100% Preserved Void Unlock & Intentional Big Chest Completion**:
              - Player can still enter the Big Chest (`pickup + 0x5b4 >= 1`) to end the run with Ending 16 intentionally.
              - Void unlock check (Secret 320) intact with enhanced diagnostic logging.

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
