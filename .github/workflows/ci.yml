name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Isaac Repentance+ iOS v1.0.4"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.4)

            ### What's Fixed in v1.0.4:
            - **Repentance ItemConfig Resolution**: Fixed root cause where balance patches were only targeting the Afterbirth+ ItemConfig (`AppManager + 0x32880`) and aborting due to item count. Now resolves and patches the actual Repentance ItemConfig (`*(base + 0xAC2428) + 0x55F30`) as well as the legacy config.
            - **Revelation (643)**: Successfully removes the +2 soul hearts upon pickup (`soulhearts = 0`).
            - **Mega Bean (351)**: Sets charges to 6 (`maxcharges = 6`).
            - **2Spooky (554)**: Sets Quality to 2 (`quality = 2`, `craftquality = 2`).
            - **Seraphim Familiar (390)**: Fixed Seraphim transformation! Player collectible table now properly detected via `Player + 0x29A0` and native `CheckTransformation` (`base + 0x1A46B8`) is triggered to advance the in-game Seraphim counter and grant flight/costume.
            - **EID Overlay Synchronization**: Dynamically hooks `EIDDescriptionStore` (when EID is present in LiveContainer) to show Quality 2 for 2Spooky and 6 charges for Mega Bean in the HUD display.
            - **Additional Rep+ Rebalances**: D12 (2 charges), Breath of Life (4 charges), Dataminer (3 charges), Camo Undies (Q2), Milk! (Q2), Shade (Q2), My Shadow (Q2).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
