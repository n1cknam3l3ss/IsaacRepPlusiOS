name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: "Isaac Repentance+ iOS v1.0.15 (Pure Data-Only / Jailed LiveContainer Fix)"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.15)

            ### What's Fixed in v1.0.15:
            - **Fixed Immediate Run-Start / Continue Crash (Invalid Page / CodeSigning)**:
              - In v1.0.14, an attempt to write an ARM64 `RET` instruction to `__TEXT` at `0x1006ddcdc` modified an executable page.
              - On non-jailbroken iOS / LiveContainer, modifying `__TEXT` triggers iOS kernel codesigning enforcement (`CODESIGNING: Invalid Page (Failed to fault in a page with execute permissions)`), terminating the game on run start or continue.
              - **100% Pure Data-Only Architecture**: All writes to executable `__TEXT` code pages have been completely eliminated.
              - Cutscene suppression now operates strictly via heap data: setting `[entity + 0xbd4] = -1` on the Mega Satan Phase 2 entity. The game's native Mega Satan death handler (`0x10078c954`) cleanly branches past the cutscene call (`tbnz w8, #0x1f, #0x10078c9b8`) with zero code modification and zero kernel protection violations.
            - **Guaranteed Void Portals**: 100% guaranteed Void Portals after Mega Satan, Mother (Corpse II), The Lamb (Dark Room), and ??? / Blue Baby (Chest).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
