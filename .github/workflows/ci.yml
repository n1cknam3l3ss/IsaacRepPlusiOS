name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Isaac Repentance+ iOS v1.0.5"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.5)

            ### What's Fixed in v1.0.5:
            - **Fixed Crash on Entering Run**: Root cause identified from crash reports (`LiveContainer-*.ips`). Calling the internal engine function `Player::HasCollectible(player, 390)` caused a null-dereference (`EXC_BAD_ACCESS at 0x1F70FC`) because game state globals (`*0x100AC0C10`) are uninitialized during room load.
            - **Safe Player Memory Access**: Replaced all direct engine function calls with safe memory reads via `SafeRead`/`SafeWrite` (`player + 0x29A0`), completely eliminating any chance of SIGSEGV upon entering a run.
            - **Repentance ItemConfig & EID**: Retained all v1.0.4 fixes (Repentance ItemConfig resolution for Revelation 0 soul hearts, Mega Bean 6 charges, 2Spooky Quality 2, and dynamic EID HUD synchronization).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
