name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.17
          name: "Isaac Repentance+ iOS v1.0.17 (Fixed Mega Satan Ending 16 Cutscene & Retained Void Unlocks)"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.17)

            ### What's Fixed in v1.0.17:
            - **4-Layer Engine Cutscene Suppression for Mega Satan Ending 16**:
              - Layer 1 (`g_Game + 0x1CF406 |= 1`): Sets engine Void portal flag so Mega Satan death routine (`0x1005026e4`) bypasses cutscene timer initiation.
              - Layer 2 (`g_Game + 0x2A5930 = 0`): Resets 89-frame countdown timer in `Game::Update` before `StartCutsceneSequence` triggers.
              - Layer 3 (`g_Game + 0x25C00 = 0`): Cancels active cutscene sequence state if initiated.
              - Layer 4 (`g_Manager + 0x1F6D08 = 0`): Intercepts queued Ending 16 in Manager while keeping deliberate Big Chest endings intact (`pickup + 0x5b4 >= 1`).
            - **Strict Save-File Void Unlock Integrity**:
              - Retained Hush defeat check (Achievement/Secret 320: "New Area"). If Void is locked, no portal spawns and vanilla cutscene behaviors are left unmodified.
            - **Item Balance & Transformation Support**:
              - Revelation (ID 643) 0 soul hearts, Mega Bean (ID 351) 6 max charges, 2Spooky (ID 554) Quality 2, Seraphim (ID 390) transformation increment.

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
