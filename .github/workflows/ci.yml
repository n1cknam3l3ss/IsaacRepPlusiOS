name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Isaac Repentance+ iOS v1.0.7"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.7)

            ### What's Fixed & Improved in v1.0.7:
            - **Fixed Mega Satan & Mother Phase 1 Portal Bug**: Guaranteed Void portals now strictly wait until Phase 2 is reached and defeated (Type 275 for Mega Satan, Variant 10 for Mother). Portals and chests will never prematurely trigger during Phase 1 transitions.
            - **Cinematic Portal Spawn Delay**: Added an aesthetic ~1.2s delay after the victory Big Chest / Trophy drops. Portals now spawn gracefully right after the chest completes its landing animation, matching desktop Repentance+.
            - **Natural Portal Suppression**: Suppressed engine-native random/awkward Void portal spawn branches in memory and actively purge rogue duplicate portals. Only a single, perfectly aligned portal appears centered 2 tiles below the chest.
            - **Retained All v1.0.6 Improvements**: Seraphim + Conjoined in EID, live progress tracking, full crash-safe memory access, Revelation (0 soul hearts), Mega Bean (6 charges), and 2Spooky (Quality 2).

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
