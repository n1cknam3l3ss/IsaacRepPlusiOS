name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepPlusiOS.dylib
          test -f packages/IsaacRepPlusiOS-rootless.deb
          test -f packages/IsaacRepPlusiOS-LiveContainer.framework.zip
          test -f dist/IsaacRepPlusiOS.zip
          otool -L build/IsaacRepPlusiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepPlusiOS-Build
          path: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: "Isaac Repentance+ iOS v1.0.10"
          body: |
            ## The Binding of Isaac: Repentance+ iOS Standalone Port (v1.0.10)

            ### What's Fixed in v1.0.10:
            - **Restored Mega Satan Chest Landing Delay & Void Portal Timing**: Fixed a logic bug where vanilla 50% natural Void portals spawned prematurely upon Mega Satan's death and were accepted immediately, skipping the ~1.2s chest drop landing delay and placing the portal at the wrong tile.
            - **Continuous Natural Portal Suppression**: During the chest falling animation, any prematurely spawned natural portals are actively purged every tick until the Big Chest finishes landing on the floor. Once the chest lands, the guaranteed Void Portal spawns cleanly exactly 2 tiles below the Big Chest.
            - **Crash-Free Heap Grid Entity Management**: All portal management operates purely through heap grid entities and C++ destructors without touching executable `__TEXT` code pages, fully compatible with LiveContainer and rootless jailbreak.
            - **All Features Retained**: Mega Satan & Mother Phase 2 validation, Challenge/Daily run suppression, Seraphim/Conjoined EID live counters, and Rep+ item balance changes.

            ### Installation:
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacRepPlusiOS-rootless.deb`.
            - **LiveContainer / Jailed**:
              Download and import `IsaacRepPlusiOS-LiveContainer.framework.zip` into LiveContainer.
            - **Sideloading / Direct Injection**:
              Inject `IsaacRepPlusiOS.dylib` into the decrypted IPA using Azule, Sideloadly, or LiveContainer.
          files: |
            build/IsaacRepPlusiOS.dylib
            packages/IsaacRepPlusiOS-rootless.deb
            packages/IsaacRepPlusiOS-LiveContainer.framework.zip
            dist/IsaacRepPlusiOS.zip
          draft: false
          prerelease: false
